<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites - Student Laptop Finder</title>
    <link rel="stylesheet" href="dist/output.css">

</head>

<body class="flex min-h-screen flex-col">
    
    <header class="sticky top-0 z-20 border-b border-line bg-card">

        <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-3">

            <h3 class="text-lg font-bold text-accent">Laptop Finder</h3>

            <div class="flex items-center gap-2 md:order-3">

                <button id="themeToggle" type="button" class="btn-action">Switch theme</button>
                <button id="navToggle" type="button" class="btn-action md:hidden" aria-controls="mainNav" aria-expanded="false">Menu</button>

            </div>

            <nav id="mainNav" class="hidden w-full gap-1 md:order-2 md:flex md:w-auto" aria-label="Main">

                <a href="index.html" class="nav-link">Home</a>
                <a href="laptops.html" class="nav-link">Catalogue</a>
                <a href="favorites.html" class="nav-link" aria-current="page">Favorites</a>
                <a href="compare.html" class="nav-link">Compare</a>
                
            </nav>

        </div>

    </header>

    <main class="mx-auto w-full max-w-6xl flex-1 space-y-6 px-4 py-8">
        <h1 class="text-3xl font-bold">Your favorites</h1>

        <section class="panel space-y-4" aria-label="Favorites summary">
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">

            <div>

                <p class="text-sm text-muted">Saved laptops</p>
                <p id="favCount" class="text-2xl font-bold text-accent">0</p>
                </div>
                <div>

                <p class="text-sm text-muted">Total price</p>
                <p id="favTotal" class="text-2xl font-bold text-accent">&mdash;</p>
                </div>
                <div>

                <p class="text-sm text-muted">Average price</p>
                <p id="favAverage" class="text-2xl font-bold text-accent">&mdash;</p>
                </div>

            </div>

        <div class="flex flex-wrap gap-3">
            
            <a href="compare.html" class="btn-action">Compare favorites</a>
            <button id="clearFavorites" type="button" class="btn-action">Clear all favorites</button>

        </div>

        </section>

        <p id="errorBox" class="alert-error hidden" role="alert"></p>
        <p id="emptyMessage" class="panel hidden text-center text-muted">You have no favorites yet. <a href="laptops.html" class="font-semibold text-accent underline">Browse the catalogue</a> and save some laptops.</p>

        <section id="favoritesGrid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3" aria-label="Saved laptops">

            <div class="laptop-card animate-pulse" aria-hidden="true">

                <div class="h-44 bg-line"></div>

                <div class="space-y-3 p-4">

                    <div class="h-5 w-3/4 rounded bg-line"></div>
                    <div class="h-4 w-1/3 rounded bg-line"></div>
                    <div class="h-4 w-full rounded bg-line"></div>
                    <div class="h-4 w-2/3 rounded bg-line"></div>
                    <div class="h-9 w-full rounded bg-line"></div>

                </div>

            </div>
            
            <div class="laptop-card animate-pulse" aria-hidden="true">

            <div class="h-44 bg-line"></div>

                <div class="space-y-3 p-4">
                    
                    <div class="h-5 w-3/4 rounded bg-line"></div>
                    <div class="h-4 w-1/3 rounded bg-line"></div>
                    <div class="h-4 w-full rounded bg-line"></div>
                    <div class="h-4 w-2/3 rounded bg-line"></div>
                    <div class="h-9 w-full rounded bg-line"></div>

                </div>

            </div>

            <div class="laptop-card animate-pulse" aria-hidden="true">

            <div class="h-44 bg-line"></div>

                <div class="space-y-3 p-4">
                    
                    <div class="h-5 w-3/4 rounded bg-line"></div>
                    <div class="h-4 w-1/3 rounded bg-line"></div>
                    <div class="h-4 w-full rounded bg-line"></div>
                    <div class="h-4 w-2/3 rounded bg-line"></div>
                    <div class="h-9 w-full rounded bg-line"></div>

                </div>

            </div>

        </section>
    
    </main>

  <script type="module" src="src/js/favoritesPage.js"></script>

</body>
</html>
