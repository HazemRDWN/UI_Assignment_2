<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue - Student Laptop Finder</title>
    <link rel="stylesheet" href="dist/output.css">


</head>

<body class="flex min-h-screen flex-col">

    <header class="sticky top-0 z-20 border-b border-line bg-card">

        <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-3">

            <h3 class="text-lg font-bold text-accent">Laptop Finder</h3>

            <div class="flex items-center gap-2 md:order-3">

                <button id="themeToggle" type="button" class="btn-action">Switch theme</button>
                <button id="navToggle" type="button" class="btn-action md:hidden" aria-controls="mainNav">Menu</button>

            </div>

            <nav id="mainNav" class="hidden w-full gap-1 md:order-2 md:flex md:w-auto" aria-label="Main">

                <a href="index.html" class="nav-link">Home</a>
                <a href="laptops.html" class="nav-link" aria-current="page">Catalogue</a>
                <a href="favorites.html" class="nav-link">Favorites</a>
                <a href="compare.html" class="nav-link">Compare</a>

            </nav>

        </div>

    </header>

    <main class="mx-auto w-full max-w-6xl flex-1 space-y-6 px-4 py-8">

    <h1 class="text-3xl font-bold">Laptop catalogue</h1>

    <section class="panel grid gap-4 sm:grid-cols-2 lg:grid-cols-5" aria-label="Search, filters and sorting">

      <div class="sm:col-span-2 lg:col-span-1">

        <label for="searchInput" class="mb-1 block text-sm font-medium">Search name or brand</label>
        <input id="searchInput" type="search" class="field" placeholder="e.g. Lenovo">

      </div>

      <div>

        <label for="categoryFilter" class="mb-1 block text-sm font-medium">Category</label>

        <select id="categoryFilter" class="field">

          <option value="all">All categories</option>
          <option value="chromebook">ChromeBook</option>
          <option value="gaming">Gaming</option>
          <option value="budget">Budget</option>

        </select>

      </div>

      <div>

        <label for="maxPriceFilter" class="mb-1 block text-sm font-medium">Maximum price</label>
        <input id="maxPriceFilter" type="number" min="0" step="50" inputmode="numeric" class="field" placeholder="Any price">

      </div>

      <div>

        <label for="minRamFilter" class="mb-1 block text-sm font-medium">Minimum RAM</label>

        <select id="minRamFilter" class="field">

          <option value="0">Any RAM</option>
          <option value="8">8 GB or more</option>
          <option value="16">16 GB or more</option>
          <option value="32">32 GB or more</option>

        </select>

      </div>

      <div>

        <label for="sortSelect" class="mb-1 block text-sm font-medium">Sort by</label>

        <select id="sortSelect" class="field">

          <option value="default">Default order</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="battery-desc">Battery: longest first</option>
          <option value="battery-asc">Battery: shortest first</option>
          <option value="weight-asc">Weight: lightest first</option>
          <option value="weight-desc">Weight: heaviest first</option>

        </select>

      </div>

    </section>

    <div class="flex flex-wrap items-center justify-between gap-3">

      <p id="resultCount" class="text-sm text-muted">Loading laptops...</p>
      <button id="resetFilters" type="button" class="btn-action">Reset filters</button>

    </div>

    <p id="errorBox" class="alert-error hidden" role="alert"></p>

    <p id="emptyMessage" class="panel hidden text-center text-muted">No laptops match your search and filters. Try changing or resetting them.</p>

    <section id="laptopGrid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3" aria-label="Laptops">

        <div class="laptop-card animate-pulse" aria-hidden="true">

          <div class="h-44 bg-line"></div>

          <div class="space-y-3 p-4">
            
            <div class="h-5 w-3/4 rounded bg-line"></div>
            <div class="h-4 w-1/3 rounded bg-line"></div>
            <div class="h-4 w-full rounded bg-line"></div>
            <div class="h-4 w-2/3 rounded bg-line"></div>
            <div class="h-9 w-full rounded bg-line"></div>

          </div>

        </div>

        <div class="laptop-card animate-pulse" aria-hidden="true">

          <div class="h-44 bg-line"></div>

          <div class="space-y-3 p-4">

            <div class="h-5 w-3/4 rounded bg-line"></div>
            <div class="h-4 w-1/3 rounded bg-line"></div>
            <div class="h-4 w-full rounded bg-line"></div>
            <div class="h-4 w-2/3 rounded bg-line"></div>
            <div class="h-9 w-full rounded bg-line"></div>

          </div>

        </div>

        <div class="laptop-card animate-pulse" aria-hidden="true">

          <div class="h-44 bg-line"></div>

          <div class="space-y-3 p-4">
            
            <div class="h-5 w-3/4 rounded bg-line"></div>
            <div class="h-4 w-1/3 rounded bg-line"></div>
            <div class="h-4 w-full rounded bg-line"></div>
            <div class="h-4 w-2/3 rounded bg-line"></div>
            <div class="h-9 w-full rounded bg-line"></div>

          </div>

        </div>

    </section>
    
</main>

<script type="module" src="src/js/catalogue.js"></script>
    
</body>

</html>
